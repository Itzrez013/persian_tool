[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "persian_tool"
version = "0.1.0b1"
description = "A Python library for converting Persian words and numbers to English."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Itzrez013"}
]


[tool.setuptools.packages.find]
where = ["src"]